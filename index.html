<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f0d" />
  <title>Chehalis 3D Terrain Lab</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="map"></div>
<div id="loading" class="loading"><div class="spinner"></div><div><b>Loading Chehalis Terrain Lab</b><span id="loadingText">Starting 3D terrain…</span></div></div>

<header class="brand panel">
  <div class="eyebrow">CHEHALIS 2-19 · ZONE A</div>
  <div class="title">3D Terrain Lab <span>Standalone · Fixed</span></div>
  <div class="readout" id="readout"><b>Elev</b> — &nbsp; <b>Slope</b> — &nbsp; <b>Aspect</b> —</div>
</header>

<aside class="controls panel">
  <div class="section">
    <div class="section-title">Layers <small id="featureCount">loading…</small></div>
    <label><span><i class="dot boundary"></i>Zone boundary</span><input type="checkbox" data-group="boundary" checked></label>
    <label><span><i class="dot roads"></i>Road access</span><input type="checkbox" data-group="roads" checked></label>
    <label><span><i class="dot cuts"></i>Cutblocks by age</span><input type="checkbox" data-group="cutblocks" checked></label>
    <label><span><i class="dot hydro"></i>Rivers + streams</span><input type="checkbox" data-group="hydro" checked></label>
    <label><span><i class="dot veg"></i>Forest age</span><input type="checkbox" data-group="vegetation"></label>
    <label><span><i class="dot wet"></i>Wetlands</span><input type="checkbox" data-group="wetlands"></label>
    <label><span><i class="dot fire"></i>Historical fires</span><input type="checkbox" data-group="fires"></label>
  </div>
  <div class="section">
    <div class="section-title">View</div>
    <div class="grid3">
      <button id="homeBtn">Whole unit</button><button id="topBtn">Top</button><button id="northBtn">North</button>
    </div>
    <div class="grid2 basemap">
      <button data-base="sat" class="active">Satellite</button><button data-base="topo">Topo</button>
    </div>
    <label class="rangeRow"><span>Terrain relief</span><output id="exagOut">1.25×</output></label>
    <input id="exag" type="range" min="0.25" max="2.5" value="1.25" step="0.05" />
  </div>
  <div class="section">
    <div class="section-title">Terrain analysis</div>
    <div class="grid3 analysis">
      <button data-analysis="none" class="active">Normal</button><button data-analysis="slope">Slope</button><button data-analysis="aspect">Aspect</button>
    </div>
  </div>
</aside>

<section class="command panel">
  <div class="command-row">
    <span class="spark">✦</span>
    <input id="cmd" type="text" autocomplete="off" placeholder='Ask the map… “highlight 1–5 year cutblocks”' />
    <button id="mic" title="Voice input">◉</button>
    <button id="run" class="run">Run</button>
  </div>
  <div class="command-meta"><span id="cmdStatus">Map commands ready</span><span>Wispr ready</span></div>
  <div class="chips">
    <button data-cmd="highlight 1-5 year cutblocks">1–5 yr cuts</button>
    <button data-cmd="show likely driveable roads">Driveable roads</button>
    <button data-cmd="show streams and wetlands">Water</button>
    <button data-cmd="turn on slope analysis">Slope</button>
    <button data-cmd="reset map">Reset</button>
  </div>
</section>

<div id="inspect" class="inspect panel" hidden><button id="closeInspect">×</button><h3>Feature</h3><div id="inspectBody"></div></div>
<div id="toast" class="toast"></div>

<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="app.js"></script>
</body>
</html>
